<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便利貼看板 Pro - Sticky Notes Board</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Patrick+Hand&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            overflow-x: hidden;
        }

        .font-handwritten {
            font-family: 'Patrick Hand', 'Noto Sans TC', cursive;
        }

        /* 便利貼色彩與上邊框樣式 */
        .note-color-yellow { background-color: #fef08a; color: #713f12; border-top: 8px solid #fde047; }
        .note-color-pink   { background-color: #fbcfe8; color: #831843; border-top: 8px solid #f472b6; }
        .note-color-green  { background-color: #bbf7d0; color: #14532d; border-top: 8px solid #4ade80; }
        .note-color-blue   { background-color: #bae6fd; color: #0c4a6e; border-top: 8px solid #38bdf8; }
        .note-color-purple { background-color: #e9d5ff; color: #581c87; border-top: 8px solid #c084fc; }
        .note-color-orange { background-color: #fed7aa; color: #7c2d12; border-top: 8px solid #fb923c; }

        /* 看板背景主題 */
        .bg-grid-dots {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .bg-corkboard {
            background-color: #d7ccc8;
            background-image: radial-gradient(#a1887f 1.2px, transparent 1.2px), radial-gradient(#a1887f 1.2px, #d7ccc8 1.2px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
        }

        .bg-dark-mode {
            background-color: #0f172a;
            background-image: radial-gradient(#334155 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .bg-lined-paper {
            background-color: #ffffff;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 100% 28px;
        }

        /* 陰影與卡片 hover 特效 */
        .sticky-card {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        .sticky-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.12), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* 拖曳狀態樣式 */
        .is-dragging {
            opacity: 0.8 !important;
            transform: scale(1.03) rotate(2deg) !important;
            cursor: grabbing !important;
            z-index: 9999 !important;
            box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.25) !important;
        }

        .drag-drop-target {
            outline: 2px dashed #f59e0b !important;
            outline-offset: 4px;
        }

        /* 淡入動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-fade {
            animation: fadeIn 0.15s ease-out forwards;
        }

        /* 隱藏原生捲動條 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-grid-dots min-h-screen flex flex-col transition-colors duration-300" id="app-body">

    <!-- 頂部功能導覽列 -->
    <header class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50 shadow-sm px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            
            <!-- Logo 與標題 -->
            <div class="flex items-center space-x-3">
                <div class="bg-amber-400 text-amber-950 p-2.5 rounded-xl shadow-inner font-bold flex items-center justify-center">
                    <i class="fa-solid fa-note-sticky text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100 tracking-wide flex items-center gap-2">
                        便利貼看板
                        <span class="text-xs font-normal px-2 py-0.5 bg-amber-100 text-amber-800 rounded-full font-mono">Pro</span>
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">雙模式拖曳、即時搜尋、自動儲存</p>
                </div>
            </div>

            <!-- 預設顏色選擇 & 新增便利貼 -->
            <div class="flex items-center space-x-2 bg-slate-100 dark:bg-slate-800 p-1.5 rounded-2xl border border-slate-200 dark:border-slate-700">
                <span class="text-xs text-slate-500 dark:text-slate-400 font-medium pl-2 pr-1 hidden sm:inline">新增顏色:</span>
                <div class="flex items-center space-x-1.5" id="color-picker-bar">
                    <button data-color="yellow" title="黃色" class="color-select-btn w-6 h-6 rounded-full bg-amber-300 ring-2 ring-offset-1 ring-amber-500 transition-all"></button>
                    <button data-color="pink" title="粉色" class="color-select-btn w-6 h-6 rounded-full bg-pink-300 transition-all"></button>
                    <button data-color="green" title="綠色" class="color-select-btn w-6 h-6 rounded-full bg-emerald-300 transition-all"></button>
                    <button data-color="blue" title="藍色" class="color-select-btn w-6 h-6 rounded-full bg-sky-300 transition-all"></button>
                    <button data-color="purple" title="紫色" class="color-select-btn w-6 h-6 rounded-full bg-purple-300 transition-all"></button>
                    <button data-color="orange" title="橘色" class="color-select-btn w-6 h-6 rounded-full bg-orange-300 transition-all"></button>
                </div>
                <div class="h-5 w-[1px] bg-slate-300 dark:bg-slate-700 mx-1"></div>
                <button id="btn-add-note" class="flex items-center gap-1.5 bg-amber-500 hover:bg-amber-600 text-white font-medium px-3.5 py-1.5 rounded-xl shadow transition-all active:scale-95 text-sm">
                    <i class="fa-solid fa-plus"></i>
                    <span>新增便利貼</span>
                </button>
            </div>

            <!-- 控制功能項 (搜尋、模式切換、背景、備份、清空) -->
            <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
                <!-- 搜尋列 -->
                <div class="relative flex-1 md:w-44">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="search-input" placeholder="搜尋內容或標題..." class="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 transition-all">
                </div>

                <!-- 排版模式切換 (網格 / 自由畫布) -->
                <button id="btn-toggle-layout" title="切換排版模式 (網格排列 / 自由擺放)" class="p-2 text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl border border-slate-200 dark:border-slate-700 text-sm transition-all">
                    <i class="fa-solid fa-border-all"></i>
                </button>

                <!-- 背景切換 -->
                <button id="btn-toggle-bg" title="變更看板背景風格" class="p-2 text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl border border-slate-200 dark:border-slate-700 text-sm transition-all">
                    <i class="fa-solid fa-palette"></i>
                </button>

                <!-- 匯入 / 匯出備份選單 -->
                <button id="btn-export-data" title="匯出便利貼 JSON 檔案" class="p-2 text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl border border-slate-200 dark:border-slate-700 text-sm transition-all">
                    <i class="fa-solid fa-download"></i>
                </button>
                <button id="btn-import-trigger" title="匯入便利貼 JSON 檔案" class="p-2 text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl border border-slate-200 dark:border-slate-700 text-sm transition-all">
                    <i class="fa-solid fa-upload"></i>
                </button>
                <input type="file" id="import-file-input" accept=".json" class="hidden">

                <!-- 全部刪除 -->
                <button id="btn-clear-all" title="清空所有便利貼" class="p-2 text-rose-600 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/50 rounded-xl border border-rose-200 dark:border-rose-900 text-sm transition-all">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>

        </div>
    </header>

    <!-- 看板主區域 -->
    <main class="flex-1 relative p-4 sm:p-6 overflow-auto min-h-[calc(100vh-80px)]" id="board-container">
        
        <!-- 當前沒有便利貼時的空狀態提示 -->
        <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 pointer-events-none transition-opacity duration-300">
            <div class="w-20 h-20 bg-slate-200/50 dark:bg-slate-800/50 rounded-full flex items-center justify-center mb-4">
                <i class="fa-solid fa-note-sticky text-4xl text-slate-400 dark:text-slate-500"></i>
            </div>
            <p class="text-lg font-medium text-slate-600 dark:text-slate-300">看板目前空空如也</p>
            <p class="text-sm text-slate-400 dark:text-slate-500 mt-1">點擊上方「新增便利貼」開始建立備忘錄！</p>
        </div>

        <!-- 便利貼容器 -->
        <div id="notes-canvas" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5 relative transition-all duration-200 min-h-[500px]">
            <!-- 便利貼項目將由 JavaScript 動態呈現 -->
        </div>

    </main>

    <!-- 對話框 (Modal) -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[1000] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-sm w-full p-6 animate-fade border border-slate-100 dark:border-slate-700">
            <div class="flex items-center space-x-3 text-rose-500 mb-3">
                <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100" id="modal-title">確定刪除？</h3>
            </div>
            <p class="text-sm text-slate-600 dark:text-slate-300 mb-6" id="modal-message">此操作將無法恢復，確定要進行嗎？</p>
            <div class="flex items-center justify-end space-x-2">
                <button id="modal-btn-cancel" class="px-4 py-2 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-all">取消</button>
                <button id="modal-btn-confirm" class="px-4 py-2 text-xs font-medium text-white bg-rose-500 hover:bg-rose-600 rounded-xl shadow-md transition-all">確認執行</button>
            </div>
        </div>
    </div>

    <!-- Toast 訊息通知容器 -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[1001] flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        const STORAGE_KEY = 'sticky_notes_app_pro_v2';

        // 全域狀態管理
        let appState = {
            notes: [],
            selectedColor: 'yellow',
            layoutMode: 'grid', // 'grid' | 'free'
            bgTheme: 'grid-dots', // 'grid-dots' | 'corkboard' | 'dark-mode' | 'lined-paper'
            highestZIndex: 100
        };

        // 拖曳狀態控制
        let gridDragSourceId = null;

        // DOM 元素快取
        const dom = {
            appBody: document.getElementById('app-body'),
            boardContainer: document.getElementById('board-container'),
            notesCanvas: document.getElementById('notes-canvas'),
            emptyState: document.getElementById('empty-state'),
            btnAddNote: document.getElementById('btn-add-note'),
            colorPickerBar: document.getElementById('color-picker-bar'),
            searchInput: document.getElementById('search-input'),
            btnToggleLayout: document.getElementById('btn-toggle-layout'),
            btnToggleBg: document.getElementById('btn-toggle-bg'),
            btnExportData: document.getElementById('btn-export-data'),
            btnImportTrigger: document.getElementById('btn-import-trigger'),
            importFileInput: document.getElementById('import-file-input'),
            btnClearAll: document.getElementById('btn-clear-all'),
            customModal: document.getElementById('custom-modal'),
            modalTitle: document.getElementById('modal-title'),
            modalMessage: document.getElementById('modal-message'),
            modalBtnCancel: document.getElementById('modal-btn-cancel'),
            modalBtnConfirm: document.getElementById('modal-btn-confirm'),
            toastContainer: document.getElementById('toast-container')
        };

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState.notes = parsed.notes || [];
                    appState.selectedColor = parsed.selectedColor || 'yellow';
                    appState.layoutMode = parsed.layoutMode || 'grid';
                    appState.bgTheme = parsed.bgTheme || 'grid-dots';
                    appState.highestZIndex = parsed.highestZIndex || 100;
                }
            } catch (err) {
                console.error('無法讀取本地儲存，改用預設狀態', err);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (err) {
                console.error('儲存至 LocalStorage 失敗', err);
                showToast('儲存失敗，容量可能已滿', 'error');
            }
        }

        function createNewNote(content = '', color = appState.selectedColor) {
            const id = 'note_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            
            // 計算自由模式預設散落位置 (靠近畫面中央)
            const boardWidth = dom.boardContainer.clientWidth || 800;
            const boardHeight = dom.boardContainer.clientHeight || 600;
            const randomX = Math.max(20, Math.floor((boardWidth / 2) - 120 + (Math.random() * 120 - 60)));
            const randomY = Math.max(20, Math.floor((boardHeight / 2) - 120 + (Math.random() * 120 - 60)));

            appState.highestZIndex += 1;

            return {
                id,
                title: '',
                content,
                color,
                pinned: false,
                fontSize: 'text-base', // 'text-sm' | 'text-base' | 'text-lg'
                x: randomX,
                y: randomY,
                zIndex: appState.highestZIndex,
                updatedAt: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })
            };
        }

        function renderBoard() {
            dom.notesCanvas.innerHTML = '';
            
            const query = dom.searchInput.value.trim().toLowerCase();
            const filteredNotes = appState.notes.filter(note => 
                note.title.toLowerCase().includes(query) || 
                note.content.toLowerCase().includes(query)
            );

            // 控制 Empty State
            if (filteredNotes.length === 0) {
                dom.emptyState.style.opacity = '1';
                dom.emptyState.style.pointerEvents = 'auto';
            } else {
                dom.emptyState.style.opacity = '0';
                dom.emptyState.style.pointerEvents = 'none';
            }

            // 設定容器 layout 模式
            if (appState.layoutMode === 'free') {
                dom.notesCanvas.className = 'relative w-full min-h-[650px]';
            } else {
                dom.notesCanvas.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5 relative';
            }

            // 釘選處理：釘選的在前
            const sortedNotes = [...filteredNotes].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

            // 繪製每張便利貼
            sortedNotes.forEach(note => {
                const noteElement = renderNoteCard(note);
                dom.notesCanvas.appendChild(noteElement);
            });

            // 更新介面 UI
            updateToolbarUI();
        }

        function renderNoteCard(note) {
            const card = document.createElement('div');
            card.id = note.id;
            card.className = `sticky-card note-color-${note.color} rounded-b-2xl rounded-tr-2xl p-4 relative flex flex-col justify-between group select-none ${
                appState.layoutMode === 'free' ? 'absolute w-64 h-64' : 'w-full min-h-[220px] h-auto'
            }`;

            if (appState.layoutMode === 'free') {
                card.style.left = `${note.x}px`;
                card.style.top = `${note.y}px`;
                card.style.zIndex = note.zIndex || 10;
            } else {
                // 網格模式允許原生 drag & drop
                card.setAttribute('draggable', 'true');
            }

            // 安全轉義文字
            const safeTitle = escapeHtml(note.title);
            const safeContent = escapeHtml(note.content);

            card.innerHTML = `
                <!-- 頁頭控制區 (拖曳握把) -->
                <div class="drag-handle flex items-center justify-between gap-1 pb-2 mb-1 border-b border-black/10 cursor-grab active:cursor-grabbing">
                    <div class="flex items-center space-x-1.5 flex-1 min-w-0">
                        <i class="fa-solid fa-grip-vertical text-xs text-black/30 group-hover:text-black/60 transition-colors"></i>
                        <button class="btn-pin text-xs p-1 text-slate-600 hover:text-amber-700 transition-colors" title="${note.pinned ? '取消置頂' : '釘選置頂'}">
                            <i class="fa-solid fa-thumbtack ${note.pinned ? 'text-rose-500 -rotate-45' : 'opacity-40'}"></i>
                        </button>
                        <input type="text" class="input-title font-bold bg-transparent border-b border-transparent hover:border-black/20 focus:border-black/40 focus:outline-none text-sm w-full truncate" placeholder="標題..." value="${safeTitle}">
                    </div>

                    <div class="flex items-center space-x-1">
                        <!-- 色彩調色盤按鈕 -->
                        <div class="relative">
                            <button class="btn-color-palette text-xs p-1 hover:bg-black/10 rounded transition-colors" title="更改顏色">
                                <i class="fa-solid fa-palette"></i>
                            </button>
                            <!-- 下拉選單 -->
                            <div class="color-dropdown absolute right-0 top-6 bg-white dark:bg-slate-800 p-1.5 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 hidden grid-cols-3 gap-1 z-50 animate-fade">
                                <button data-set-color="yellow" class="w-5 h-5 rounded-full bg-amber-300 hover:scale-110 transition-transform"></button>
                                <button data-set-color="pink" class="w-5 h-5 rounded-full bg-pink-300 hover:scale-110 transition-transform"></button>
                                <button data-set-color="green" class="w-5 h-5 rounded-full bg-emerald-300 hover:scale-110 transition-transform"></button>
                                <button data-set-color="blue" class="w-5 h-5 rounded-full bg-sky-300 hover:scale-110 transition-transform"></button>
                                <button data-set-color="purple" class="w-5 h-5 rounded-full bg-purple-300 hover:scale-110 transition-transform"></button>
                                <button data-set-color="orange" class="w-5 h-5 rounded-full bg-orange-300 hover:scale-110 transition-transform"></button>
                            </div>
                        </div>

                        <!-- 刪除按鈕 -->
                        <button class="btn-delete text-xs p-1 hover:bg-rose-500/20 text-slate-700 hover:text-rose-600 rounded transition-colors" title="刪除便利貼">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- 文字輸入內容 -->
                <div class="flex-1 my-1">
                    <textarea class="input-content w-full h-full min-h-[110px] bg-transparent resize-none focus:outline-none ${note.fontSize} font-handwritten leading-relaxed" placeholder="寫點什麼內容...">${safeContent}</textarea>
                </div>

                <!-- 頁尾時間與輔助功能 -->
                <div class="flex items-center justify-between text-[10px] opacity-65 pt-1.5 border-t border-black/5 mt-1 select-none">
                    <span class="font-mono">${note.updatedAt}</span>
                    <div class="flex items-center space-x-1.5">
                        <button class="btn-font-size hover:font-bold px-1" title="切換文字大小">
                            <i class="fa-solid fa-font text-[11px]"></i>
                        </button>
                        <button class="btn-copy hover:text-black px-1" title="複製便利貼文字">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>
            `;

            // 繫結事件處理
            attachNoteEvents(card, note);

            return card;
        }

        function attachNoteEvents(card, note) {
            const inputTitle = card.querySelector('.input-title');
            const inputContent = card.querySelector('.input-content');
            const btnPin = card.querySelector('.btn-pin');
            const btnDelete = card.querySelector('.btn-delete');
            const btnColorPalette = card.querySelector('.btn-color-palette');
            const colorDropdown = card.querySelector('.color-dropdown');
            const btnFontSize = card.querySelector('.btn-font-size');
            const btnCopy = card.querySelector('.btn-copy');
            const dragHandle = card.querySelector('.drag-handle');

            // 阻止 input / textarea 觸發卡片拖曳
            [inputTitle, inputContent].forEach(el => {
                el.addEventListener('pointerdown', e => e.stopPropagation());
                el.addEventListener('mousedown', e => e.stopPropagation());
                el.addEventListener('touchstart', e => e.stopPropagation());
            });

            // 內容變更監聽
            inputTitle.addEventListener('input', e => {
                note.title = e.target.value;
                note.updatedAt = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                saveState();
            });

            inputContent.addEventListener('input', e => {
                note.content = e.target.value;
                note.updatedAt = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                saveState();
            });

            // 釘選
            btnPin.addEventListener('click', e => {
                e.stopPropagation();
                note.pinned = !note.pinned;
                saveState();
                renderBoard();
            });

            // 刪除便利貼
            btnDelete.addEventListener('click', e => {
                e.stopPropagation();
                showConfirmModal('刪除便利貼', '確定要刪除這張便利貼嗎？', () => {
                    appState.notes = appState.notes.filter(n => n.id !== note.id);
                    saveState();
                    renderBoard();
                    showToast('已刪除便利貼', 'info');
                });
            });

            // 調色盤彈出視窗
            btnColorPalette.addEventListener('click', e => {
                e.stopPropagation();
                const isHidden = colorDropdown.classList.contains('hidden');
                document.querySelectorAll('.color-dropdown').forEach(d => d.classList.add('hidden'));
                if (isHidden) {
                    colorDropdown.classList.remove('hidden');
                    colorDropdown.classList.add('grid');
                }
            });

            // 變更顏色選項點擊
            colorDropdown.querySelectorAll('[data-set-color]').forEach(btn => {
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    const newColor = btn.getAttribute('data-set-color');
                    note.color = newColor;
                    saveState();
                    renderBoard();
                });
            });

            // 切換字型大小
            btnFontSize.addEventListener('click', e => {
                e.stopPropagation();
                const sizes = ['text-sm', 'text-base', 'text-lg'];
                const currentIndex = sizes.indexOf(note.fontSize || 'text-base');
                note.fontSize = sizes[(currentIndex + 1) % sizes.length];
                saveState();
                renderBoard();
            });

            // 複製內容
            btnCopy.addEventListener('click', e => {
                e.stopPropagation();
                const fullText = (note.title ? `【${note.title}】\n` : '') + note.content;
                copyToClipboard(fullText);
            });

            // 點擊置頂 (提升 zIndex)
            card.addEventListener('pointerdown', () => {
                if (appState.layoutMode === 'free') {
                    appState.highestZIndex += 1;
                    note.zIndex = appState.highestZIndex;
                    card.style.zIndex = note.zIndex;
                    saveState();
                }
            });

            // 綁定拖曳功能
            if (appState.layoutMode === 'free') {
                bindPointerDragForFreeLayout(card, note, dragHandle);
            } else {
                bindHTML5DragForGridLayout(card, note);
            }
        }

        function bindPointerDragForFreeLayout(card, note, dragHandle) {
            let isDragging = false;
            let startPointerX = 0;
            let startPointerY = 0;
            let initialCardX = 0;
            let initialCardY = 0;

            const onPointerDown = e => {
                // 忽略按鈕點擊
                if (e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea')) return;

                isDragging = true;
                startPointerX = e.clientX;
                startPointerY = e.clientY;
                initialCardX = note.x;
                initialCardY = note.y;

                card.classList.add('is-dragging');
                dragHandle.setPointerCapture(e.pointerId);
            };

            const onPointerMove = e => {
                if (!isDragging) return;

                const dx = e.clientX - startPointerX;
                const dy = e.clientY - startPointerY;

                let newX = initialCardX + dx;
                let newY = initialCardY + dy;

                // 畫布邊界控制
                const canvasBounds = dom.boardContainer.getBoundingClientRect();
                newX = Math.max(10, Math.min(newX, canvasBounds.width - card.clientWidth - 10));
                newY = Math.max(10, Math.min(newY, canvasBounds.height - card.clientHeight - 10));

                card.style.left = `${newX}px`;
                card.style.top = `${newY}px`;

                note.x = newX;
                note.y = newY;
            };

            const onPointerUp = e => {
                if (!isDragging) return;
                isDragging = false;
                card.classList.remove('is-dragging');
                try {
                    dragHandle.releasePointerCapture(e.pointerId);
                } catch (err) {}
                saveState();
            };

            dragHandle.addEventListener('pointerdown', onPointerDown);
            dragHandle.addEventListener('pointermove', onPointerMove);
            dragHandle.addEventListener('pointerup', onPointerUp);
            dragHandle.addEventListener('pointercancel', onPointerUp);
        }

        function bindHTML5DragForGridLayout(card, note) {
            card.addEventListener('dragstart', e => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                    e.preventDefault();
                    return;
                }
                gridDragSourceId = note.id;
                card.classList.add('opacity-50');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', note.id);
            });

            card.addEventListener('dragend', () => {
                card.classList.remove('opacity-50');
                document.querySelectorAll('.drag-drop-target').forEach(el => el.classList.remove('drag-drop-target'));
                gridDragSourceId = null;
            });

            card.addEventListener('dragover', e => {
                if (!gridDragSourceId || gridDragSourceId === note.id) return;
                e.preventDefault();
                card.classList.add('drag-drop-target');
            });

            card.addEventListener('dragleave', () => {
                card.classList.remove('drag-drop-target');
            });

            card.addEventListener('drop', e => {
                if (!gridDragSourceId || gridDragSourceId === note.id) return;
                e.preventDefault();
                card.classList.remove('drag-drop-target');

                // 進行陣列順序交換
                const sourceIndex = appState.notes.findIndex(n => n.id === gridDragSourceId);
                const targetIndex = appState.notes.findIndex(n => n.id === note.id);

                if (sourceIndex !== -1 && targetIndex !== -1) {
                    const [movedNote] = appState.notes.splice(sourceIndex, 1);
                    appState.notes.splice(targetIndex, 0, movedNote);
                    saveState();
                    renderBoard();
                    showToast('便利貼位置已更新', 'info');
                }
            });
        }

        function updateToolbarUI() {
            // 色彩選擇光圈
            const colorButtons = dom.colorPickerBar.querySelectorAll('.color-select-btn');
            colorButtons.forEach(btn => {
                const c = btn.getAttribute('data-color');
                if (c === appState.selectedColor) {
                    btn.className = `color-select-btn w-6 h-6 rounded-full bg-${getTailwindBg(c)} ring-2 ring-offset-1 ring-amber-500 scale-110 transition-all`;
                } else {
                    btn.className = `color-select-btn w-6 h-6 rounded-full bg-${getTailwindBg(c)} hover:ring-2 hover:ring-offset-1 hover:ring-slate-300 transition-all`;
                }
            });

            // 圖示與排版提示
            if (appState.layoutMode === 'free') {
                dom.btnToggleLayout.innerHTML = '<i class="fa-solid fa-up-down-left-right text-amber-600"></i>';
                dom.btnToggleLayout.title = '目前：自由畫布模式 (點擊切換為整齊網格)';
                dom.btnToggleLayout.classList.add('bg-amber-100', 'border-amber-300');
            } else {
                dom.btnToggleLayout.innerHTML = '<i class="fa-solid fa-border-all"></i>';
                dom.btnToggleLayout.title = '目前：整齊網格模式 (點擊切換為自由畫布)';
                dom.btnToggleLayout.classList.remove('bg-amber-100', 'border-amber-300');
            }

            // 看板背景樣式
            dom.appBody.className = `bg-${appState.bgTheme} min-h-screen flex flex-col transition-colors duration-300`;
        }

        function getTailwindBg(color) {
            const map = { yellow: 'amber-300', pink: 'pink-300', green: 'emerald-300', blue: 'sky-300', purple: 'purple-300', orange: 'orange-300' };
            return map[color] || 'amber-300';
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-rose-500' : type === 'success' ? 'bg-emerald-600' : 'bg-slate-800';
            
            toast.className = `${bgClass} text-white text-xs px-4 py-2.5 rounded-xl shadow-lg flex items-center space-x-2 transition-all duration-300 transform translate-y-3 opacity-0 pointer-events-auto`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'error' ? 'fa-circle-xmark' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}"></i>
                <span>${message}</span>
            `;

            dom.toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-3', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-3');
                setTimeout(() => toast.remove(), 300);
            }, 2600);
        }

        let confirmCallback = null;
        function showConfirmModal(title, message, onConfirm) {
            dom.modalTitle.textContent = title;
            dom.modalMessage.textContent = message;
            confirmCallback = onConfirm;
            dom.customModal.classList.remove('hidden');
        }

        function hideModal() {
            dom.customModal.classList.add('hidden');
            confirmCallback = null;
        }

        dom.modalBtnCancel.addEventListener('click', hideModal);
        dom.modalBtnConfirm.addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            hideModal();
        });

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function copyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-99999px";
            document.body.appendChild(textArea);
            textArea.select();

            try {
                const ok = document.execCommand('copy');
                if (ok) showToast('已複製便利貼內容！', 'success');
                else showToast('複製失敗', 'error');
            } catch (err) {
                showToast('無法存取剪貼簿', 'error');
            }
            document.body.removeChild(textArea);
        }

        // 預設顏色按鈕列
        dom.colorPickerBar.querySelectorAll('.color-select-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                appState.selectedColor = btn.getAttribute('data-color');
                saveState();
                updateToolbarUI();
            });
        });

        // 新增便利貼
        dom.btnAddNote.addEventListener('click', () => {
            const note = createNewNote('', appState.selectedColor);
            appState.notes.unshift(note);
            saveState();
            renderBoard();

            // 自動聚焦到新創建立的輸入框
            setTimeout(() => {
                const el = document.getElementById(note.id);
                if (el) {
                    const ta = el.querySelector('.input-content');
                    if (ta) ta.focus();
                }
            }, 50);

            showToast('已建立新便利貼', 'success');
        });

        // 即時搜尋
        dom.searchInput.addEventListener('input', () => {
            renderBoard();
        });

        // 切換排版
        dom.btnToggleLayout.addEventListener('click', () => {
            appState.layoutMode = appState.layoutMode === 'grid' ? 'free' : 'grid';
            saveState();
            renderBoard();
            showToast(appState.layoutMode === 'free' ? '切換為自由畫布模式（可任意拖曳）' : '切換為整齊網格模式', 'info');
        });

        // 切換背景風格
        dom.btnToggleBg.addEventListener('click', () => {
            const bgThemes = ['grid-dots', 'corkboard', 'dark-mode', 'lined-paper'];
            const currentIndex = bgThemes.indexOf(appState.bgTheme);
            appState.bgTheme = bgThemes[(currentIndex + 1) % bgThemes.length];
            saveState();
            updateToolbarUI();
            showToast('已更新看板背景', 'info');
        });

        // 匯出 JSON 備份
        dom.btnExportData.addEventListener('click', () => {
            if (appState.notes.length === 0) {
                showToast('看板目前無資料可匯出', 'info');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `便利貼看板備份_${new Date().toISOString().slice(0, 10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast('已將便利貼匯出為 JSON 備份檔', 'success');
        });

        // 匯入 JSON 備份
        dom.btnImportTrigger.addEventListener('click', () => {
            dom.importFileInput.click();
        });

        dom.importFileInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = event => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported.notes)) {
                        appState.notes = imported.notes;
                        if (imported.layoutMode) appState.layoutMode = imported.layoutMode;
                        if (imported.bgTheme) appState.bgTheme = imported.bgTheme;
                        saveState();
                        renderBoard();
                        showToast('成功匯入備份資料！', 'success');
                    } else {
                        showToast('無效的備份檔案格式', 'error');
                    }
                } catch (err) {
                    showToast('解析 JSON 檔案失敗', 'error');
                }
            };
            reader.readAsText(file);
            dom.importFileInput.value = '';
        });

        // 清空所有便利貼
        dom.btnClearAll.addEventListener('click', () => {
            if (appState.notes.length === 0) {
                showToast('目前沒有便利貼可清空', 'info');
                return;
            }
            showConfirmModal('清空所有便利貼', '您確定要刪除看板上的所有便利貼嗎？此動作無法還原。', () => {
                appState.notes = [];
                saveState();
                renderBoard();
                showToast('已清空所有便利貼', 'info');
            });
        });

        // 全域關閉顏色選單
        document.addEventListener('click', e => {
            if (!e.target.closest('.btn-color-palette') && !e.target.closest('.color-dropdown')) {
                document.querySelectorAll('.color-dropdown').forEach(d => d.classList.add('hidden'));
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            renderBoard();
        });
    </script>
</body>
</html>
